<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cristiano Barata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#090E13;
    --graphite:#111820;
    --paper:#E9EFF2;
    --steel:#8696a1;
    --cyan:#19D8E8;
    --amber:#FFB45E;
    --mat:#1f3d36;
    --pad:clamp(20px,4vw,56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--deep);color:var(--paper);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .mono{font-family:'IBM Plex Mono',monospace}

  /* top bar */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px var(--pad);background:rgba(9,14,19,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(233,239,242,.07)}
  .logo{display:flex;width:34px;height:34px;flex:none}
  .bar nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .bar nav a{text-decoration:none;font-size:.95rem;padding:.4rem .75rem;border-radius:6px;color:#c4ced4;white-space:nowrap}
  .bar nav a:hover{color:var(--paper);background:rgba(233,239,242,.06)}
  .bar nav a.cv{color:var(--deep);background:var(--paper);font-weight:500}
  .lang{display:flex;flex:none;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(233,239,242,.22);padding:3px}
  .lang button{font:500 .8rem 'IBM Plex Mono',monospace;background:none;border:0;color:var(--steel);padding:.3rem .5rem;border-radius:5px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--cyan);color:var(--deep)}

  /* hero: the sample fills the whole screen, text sits on top */
  .hero{position:relative;overflow:hidden;min-height:calc(100vh - 63px);display:grid;grid-template-rows:1fr auto;touch-action:pan-y;cursor:crosshair;
    background:radial-gradient(ellipse at 60% 45%,#0f1a24 0%,var(--deep) 70%);border-bottom:1px solid rgba(233,239,242,.07)}
  #field{position:absolute;inset:0;width:100%;height:100%;display:block}
  .intro{position:relative;z-index:1;align-self:center;padding:56px var(--pad);max-width:44rem;pointer-events:none}
  .intro::before{content:"";position:absolute;inset:-40px -160px -40px -80px;z-index:-1;background:radial-gradient(ellipse at 35% 50%,rgba(9,14,19,.78) 0%,rgba(9,14,19,.45) 45%,transparent 72%)}
  .intro a{pointer-events:auto;cursor:pointer}
  h1{font-size:clamp(3rem,8vw,7rem);font-weight:800;line-height:.9;letter-spacing:-.035em;text-shadow:0 0 30px rgba(9,14,19,.9)}
  .tag{margin-top:1.1rem;font-size:clamp(1.3rem,2.3vw,1.85rem);font-weight:500;color:var(--cyan);text-shadow:0 0 20px rgba(9,14,19,.95)}
  .lede{margin-top:1.2rem;font-size:1.12rem;color:#c9d3d9;max-width:34rem;text-shadow:0 0 14px rgba(9,14,19,1)}
  .ctas{display:flex;gap:12px;margin-top:2rem;flex-wrap:wrap}
  .btn{display:inline-block;text-decoration:none;font-weight:500;padding:.75rem 1.2rem;border-radius:8px;background:var(--cyan);color:var(--deep)}
  .btn.ghost{background:rgba(9,14,19,.6);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(233,239,242,.3)}
  .instrument{position:relative;z-index:1;pointer-events:none;padding:0 var(--pad) 22px;display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end}
  #trace{width:100%;height:70px;display:block;border-top:1px solid rgba(233,239,242,.08)}
  .readout{font-size:.76rem;color:var(--steel);line-height:1.7;text-align:right}
  .readout b{color:var(--amber);font-weight:500}
  .hint{grid-column:1/-1;font-size:.8rem;color:var(--steel)}

  section{padding:96px var(--pad)}
  h2{font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:700;letter-spacing:-.025em;line-height:1.05}
  .sub{color:#aab6bd;margin-top:.6rem;max-width:38rem;font-size:1.05rem}

  /* research spectrum */
  .bandwrap{position:relative;height:84px;margin-top:40px}
  .band{position:absolute;inset:0;border-radius:3px;opacity:.16;
    background:linear-gradient(90deg,#4b1d8f 0%,#2a3cff 14%,#00a3ff 28%,#00d9a0 42%,#8fe03a 54%,#ffe23a 64%,#ff9a1f 76%,#ff3b1f 88%,#7a0a0a 100%)}
  .line{position:absolute;top:0;height:100%;width:28px;margin-left:-14px;background:none;border:0;cursor:pointer;display:flex;justify-content:center}
  .line::before{content:"";width:2px;height:100%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 26px var(--c);opacity:.7;transition:opacity .15s,width .15s}
  .line.hot::before{opacity:1;width:5px}
  .rows{list-style:none;margin-top:20px;border-top:1px solid rgba(233,239,242,.1)}
  .rows button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:4px minmax(9rem,15rem) 1fr auto;gap:20px;align-items:center;padding:18px 8px;border-bottom:1px solid rgba(233,239,242,.1)}
  .rows button:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
  .rows .sw{height:34px;background:var(--c);box-shadow:0 0 12px var(--c);border-radius:2px}
  .rows .nm{font-weight:700;font-size:1.2rem}
  .rows .hk{color:#b9c4cb}
  .rows .mt{font-size:.78rem;color:var(--steel);text-align:right}
  .rows button:hover,.rows button.hot{background:rgba(233,239,242,.04)}
  .pubs{margin-top:56px}
  .pubs h3{font-size:1.3rem;font-weight:700}
  .pubs ul{list-style:none;margin-top:12px}
  .pubs li{display:grid;grid-template-columns:9rem 1fr;gap:16px;padding:10px 0;border-bottom:1px solid rgba(233,239,242,.08);color:#c4ced4}
  .pubs li span{font-size:.8rem;color:var(--amber);padding-top:.15rem}

  /* bench */
  .bench{background:linear-gradient(var(--deep),#0c1517 160px)}
  .benchstage{position:relative;height:clamp(420px,58vw,720px);perspective:1700px;perspective-origin:50% 20%;overflow:hidden;margin-top:24px}
  .mat{position:absolute;left:50%;top:50%;width:1800px;height:1000px;margin:-500px 0 0 -900px;transform-style:preserve-3d;border-radius:14px;
    background:
      repeating-linear-gradient(0deg,transparent 0 49px,rgba(255,255,255,.12) 49px 50px),
      repeating-linear-gradient(90deg,transparent 0 49px,rgba(255,255,255,.12) 49px 50px),
      repeating-linear-gradient(0deg,transparent 0 9px,rgba(255,255,255,.04) 9px 10px),
      repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.04) 9px 10px),
      var(--mat);
    box-shadow:0 0 0 14px #18322c,0 80px 120px rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
  .scr{position:absolute;overflow:hidden}
  .obj{position:absolute;transform-style:preserve-3d;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .obj:hover,.obj:focus-visible,.obj.lift{transform:translateZ(18px)}
  .obj:focus-visible{outline:none}
  .obj:focus-visible .top{outline:3px solid var(--cyan);outline-offset:4px}
  .face{position:absolute}
  .top{left:0;top:0;width:100%;height:100%;overflow:hidden}
  .shadow{position:absolute;inset:6px;background:rgba(0,0,0,.45);filter:blur(10px);transform:translate(10px,14px)}
  .label{position:absolute;font-weight:700;font-size:22px;background:var(--amber);color:#2a1a05;padding:3px 10px;border-radius:3px;white-space:nowrap}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pills button{font:inherit;font-size:.95rem;background:none;color:var(--paper);border:1px solid rgba(233,239,242,.25);border-radius:999px;padding:.4rem .9rem;cursor:pointer}
  .pills button:hover{border-color:var(--amber);color:var(--amber)}

  /* theatre */
  .stagebit{position:relative;overflow:hidden;background:#0b0a0d}
  .stagebit .spot{position:absolute;inset:0;background:radial-gradient(ellipse 460px 560px at 74% 0%,rgba(255,180,94,.17),transparent 70%);pointer-events:none}
  .stagebit .wrap{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
  .stagebit .intro2 p{color:#c4ced4;font-size:1.1rem;max-width:32rem;margin-top:1rem}
  .stagebit .fatal{margin-top:1.4rem;font-size:.85rem;color:var(--steel);max-width:32rem}
  .bill{list-style:none;border-top:1px solid rgba(255,180,94,.35)}
  .bill li{display:grid;grid-template-columns:4.5rem 1fr;gap:6px 20px;padding:20px 0;border-bottom:1px solid rgba(255,180,94,.18)}
  .bill .yr{font-size:.85rem;color:var(--amber);padding-top:.35rem}
  .bill .ttl{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .bill .ttl small{display:block;font-size:.95rem;font-weight:400;color:#aab6bd;letter-spacing:0;margin-top:.2rem}
  .bill .rl{grid-column:2;color:#c4ced4}
  .bill .aw{grid-column:2;justify-self:start;font-size:.78rem;color:var(--amber);border:1px solid rgba(255,180,94,.45);padding:.2rem .55rem;border-radius:4px;margin-top:.2rem}
  .bill .plays{display:flex;flex-wrap:wrap;gap:8px;grid-column:2;margin-top:.3rem}
  .bill .plays span{font-size:1.15rem;font-weight:700;padding:.25rem .7rem;border-radius:4px;background:rgba(255,180,94,.1)}

  footer{padding:96px var(--pad) 64px;border-top:1px solid rgba(233,239,242,.07)}
  footer .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;list-style:none}
  footer .links a{display:inline-block;text-decoration:none;padding:.6rem 1rem;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(233,239,242,.25)}
  footer .links a:hover{box-shadow:inset 0 0 0 1px var(--cyan);color:var(--cyan)}
  footer .note{margin-top:20px;font-size:.8rem;color:var(--steel)}

  /* case-study drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
  .scrim.on{opacity:1;pointer-events:auto}
  .scrim.light{background:rgba(0,0,0,.12)}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100vw);background:var(--graphite);z-index:31;overflow:auto;padding:36px 34px 48px;
    transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);border-left:1px solid rgba(233,239,242,.1)}
  .drawer.open{transform:none}
  .drawer .cat{font-size:.8rem;color:var(--steel);padding-right:90px}
  .drawer h3{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:.4rem}
  .drawer .status{display:inline-block;margin-top:.9rem;font-size:.78rem;color:var(--amber);border:1px solid rgba(255,180,94,.45);padding:.2rem .55rem;border-radius:4px}
  .drawer dl{margin-top:1.6rem}
  .drawer dt{font-weight:700;margin-top:1.1rem}
  .drawer dd{color:#c4ced4;margin-top:.2rem}
  .drawer dd.todo{color:var(--steel);font-style:italic}
  .stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:1.6rem}
  .stack span{font-size:.75rem;padding:.25rem .55rem;border-radius:4px;background:rgba(25,216,232,.1);color:var(--cyan)}
  .dlinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.8rem}
  .dlinks a{text-decoration:none;padding:.55rem .9rem;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(233,239,242,.25);font-size:.95rem}
  .close{position:absolute;top:18px;right:18px;font:inherit;background:none;color:var(--paper);border:1px solid rgba(233,239,242,.25);border-radius:6px;padding:.35rem .7rem;cursor:pointer}

  @media (max-width:860px){
    .bar nav a:not(.cv){display:none}
    .hero{min-height:88vh}
    .rows button{grid-template-columns:4px 1fr;gap:4px 14px}
    .rows .sw{grid-row:span 3;height:100%}
    .rows .mt{text-align:left}
    .pubs li{grid-template-columns:1fr;gap:2px}
    .stagebit .wrap{grid-template-columns:1fr;gap:32px}
    .readout{display:none}
    .benchstage{height:340px}
    .drawer{top:auto;bottom:0;height:62vh;width:100%;border-left:0;border-top:1px solid rgba(233,239,242,.15);border-radius:14px 14px 0 0;transform:translateY(102%)}
    .scrim{background:rgba(0,0,0,.25)}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drawer,.scrim,.obj,.mat{transition:none}}
</style>
</head>
<body>

<header class="bar">
  <a class="logo" href="#top" data-i18n-aria="logo">

</header>

<section class="hero" id="top" style="padding:0">

<section id="research">

  <div class="pubs">

    <ul data-i18n-html="pubs.list"></ul>
  </div>
</section>

<section id="bench" class="bench">
  <h2 data-i18n="bench.h"></h2>
  <p class="sub" data-i18n="bench.sub"></p>
  <div class="benchstage" id="benchstage"><div class="mat" id="mat"></div></div>
  <div class="pills" id="pills" role="group"></div>
</section>

<section id="theatre" class="stagebit">
  <div class="spot" aria-hidden="true"></div>
  <div class="wrap">
    <div class="intro2">
      <h2 data-i18n="th.h"></h2>
      <p data-i18n="th.p"></p>
      <p class="fatal mono" data-i18n="th.fatal"></p>
    </div>
    <ul class="bill" data-i18n-html="th.bill"></ul>
  </div>
</section>

<footer id="contact">
  <h2 data-i18n="ct.h"></h2>
  <p class="sub" data-i18n="ct.sub"></p>
  <ul class="links">
    <li><a href="#contact">Email</a></li>
    <li><a href="https://github.com/WhySoSeriusBro">GitHub</a></li>
    <li><a href="#contact">LinkedIn</a></li>
    <li><a href="#contact">ORCID</a></li>
    <li><a href="#contact">Google Scholar</a></li>
    <li><a href="#contact" data-i18n="nav.cv"></a></li>
  </ul>
  <p class="note mono" data-i18n="ct.note"></p>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <button class="close" id="dClose" data-i18n="d.close"></button>
  <div class="cat mono" id="dCat"></div>
  <h3 id="dTitle"></h3>
  <div class="status mono" id="dStatus"></div>
  <dl id="dBody"></dl>
  <div class="stack mono" id="dStack"></div>
  <div class="dlinks" id="dLinks"></div>
</aside>

/* ---------- spectrum ---------- */
function wl(n){
  let r=0,g=0,b=0;
  if(n<440){r=-(n-440)/60;b=1}else if(n<490){g=(n-440)/50;b=1}else if(n<510){g=1;b=-(n-510)/20}
  else if(n<580){r=(n-510)/70;g=1}else if(n<645){r=1;g=-(n-645)/65}else{r=1}
  return [r,g,b].map(v=>Math.round(255*Math.pow(v,.8)));
}
const linesEl=document.getElementById('lines'),rowsEl=document.getElementById('rows');
function buildResearch(){
  linesEl.innerHTML='';rowsEl.innerHTML='';
  researchKeys.forEach(k=>{
    const p=PR[k],c=`rgb(${wl(p.nm).join(',')})`,L=p[lang];
    const l=document.createElement('button');l.className='line';l.tabIndex=-1;l.style.left=((p.nm-420)/260*100)+'%';l.style.setProperty('--c',c);
    l.onclick=()=>openCase(k);linesEl.appendChild(l);
    const li=document.createElement('li'),b=document.createElement('button');b.style.setProperty('--c',c);
    b.innerHTML=`<span class="sw"></span><span class="nm">${nameOf(p)}</span><span class="hk">${L.hook}</span><span class="mt mono">${L.meta}</span>`;
    b.onclick=()=>openCase(k);
    const hot=on=>{l.classList.toggle('hot',on);b.classList.toggle('hot',on)};
    [b,l].forEach(el=>{el.addEventListener('pointerenter',()=>hot(true));el.addEventListener('pointerleave',()=>hot(false))});
    b.addEventListener('focus',()=>hot(true));b.addEventListener('blur',()=>hot(false));
    li.appendChild(b);rowsEl.appendChild(li);
  });
}

function box({key,x,y,w,d,h,col,top='',south='',radius=0,glow='',z=0,alpha=1,shadow=true}){
  const o=document.createElement('div');o.className='obj';o.dataset.key=key;
  Object.assign(o.style,{left:x+'px',top:y+'px',width:w+'px',height:d+'px'});
  if(shadow&&z<6)o.innerHTML=`<div class="shadow" style="border-radius:${radius}px;${glow}"></div>`;
  const Z=z?`translateZ(${z}px) `:'';
  const f=(css,html='')=>{const e=document.createElement('div');e.className='face';e.style.cssText=css;e.innerHTML=html;o.appendChild(e);return e};
  f(`left:0;top:0;width:${w}px;height:${h}px;transform-origin:0 0;transform:${Z}rotateX(90deg);background:${shade(col,.55,alpha)}`);
  f(`left:0;top:0;width:${h}px;height:${d}px;transform-origin:0 0;transform:${Z}rotateY(-90deg);background:${shade(col,.6,alpha)}`);
  f(`left:${w}px;top:0;width:${h}px;height:${d}px;transform-origin:0 0;transform:${Z}rotateY(-90deg);background:${shade(col,.72,alpha)}`);
  f(`left:0;top:${d-h}px;width:${w}px;height:${h}px;transform-origin:0 100%;transform:${Z}rotateX(-90deg);background:${shade(col,.82,alpha)};overflow:hidden`,south);
  f(`transform:translateZ(${h+z}px);background:${shade(col,1,alpha)};border-radius:${radius}px`,top).classList.add('top');
  mat.appendChild(o);
  (groups[key]=groups[key]||[]).push(o);
  const b=bboxes[key]||(bboxes[key]={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9});
  b.x0=Math.min(b.x0,x);b.y0=Math.min(b.y0,y);b.x1=Math.max(b.x1,x+w);b.y1=Math.max(b.y1,y+d);
  return o;
}

let rx=52,rz=-16,tX=0,tZ=0,sc=1,focusKey=null;
function narrow(){return innerWidth<860}
function fit(){
  const W=stageEl.clientWidth,H=stageEl.clientHeight;
  sc=Math.min(W/2120,H/880);
  apply();
}
function apply(){
  let pre='',S=sc,fx=0,fy=0,tz=tZ,tx_=tX;
  if(focusKey&&bboxes[focusKey]){
    const b=bboxes[focusKey],cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,bw=Math.max(b.x1-b.x0,b.y1-b.y0,200);
    const W=stageEl.clientWidth,H=stageEl.clientHeight;
    const shift=(!narrow()&&!drawer.hidden)?Math.min(260,W*.2):0;
    S=Math.max(sc,Math.min((W-shift*2)/(bw*1.7),H/(bw*1.25),1.6));
    fx=MW/2-cx;fy=MH/2-cy;pre=`translateX(${-shift}px) `;tz=0;tx_=0;
  }
  mat.style.transform=`${pre}scale(${S}) rotateX(${rx+tx_}deg) rotateZ(${rz+tz}deg) translate(${fx}px,${fy}px)`;
}
function focusOn(k){focusKey=k;apply();if(narrow())stageEl.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}
function unfocus(){focusKey=null;apply()}

/* ---------- luminescence sample (full hero) ---------- */
const hero=document.getElementById('top');
const cv=document.getElementById('field'),cx=cv.getContext('2d');
const tr=document.getElementById('trace'),tx=tr.getContext('2d');
const countsEl=document.getElementById('counts');
let W,H,P=[],mouse={x:-999,y:-999,on:false},rings=[];
const TAU=.6,hist=new Array(220).fill(0);
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  tr.width=tr.clientWidth*dpr;tr.height=tr.clientHeight*dpr;tx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.min(W*H/1900,touch?260:700)|0;
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,e:0,c:wl(440+Math.random()*230)}));
}
addEventListener('resize',resize);resize();
function pulse(x,y){rings.push({x,y,r:0});for(const p of P){const d=Math.hypot(p.x-x,p.y-y);if(d<320)p.e=Math.max(p.e,1-d/400)}}
hero.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.on=true});
hero.addEventListener('pointerleave',()=>mouse.on=false);
hero.addEventListener('pointerdown',e=>{if(e.target.closest('a,button'))return;const r=cv.getBoundingClientRect();pulse(e.clientX-r.left,e.clientY-r.top)});
let last=performance.now(),visible=true;
new IntersectionObserver(([en])=>{visible=en.isIntersecting}).observe(hero);
function frame(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(visible){
    cx.globalCompositeOperation='source-over';cx.fillStyle='rgba(9,14,19,.38)';cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation='lighter';
    let I=0;const k=Math.exp(-dt/TAU);
    for(const p of P){
      if(!reduce){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H}
      if(mouse.on){const d=Math.hypot(p.x-mouse.x,p.y-mouse.y);if(d<120)p.e=Math.min(1,p.e+dt*5*(1-d/120))}
      p.e*=k;I+=p.e;
      const [r,g,b]=p.c,s=1+p.e*2.6;
      cx.fillStyle=`rgba(${r},${g},${b},${.14+p.e*.86})`;cx.beginPath();cx.arc(p.x,p.y,s,0,6.283);cx.fill();
      if(p.e>.25){cx.fillStyle=`rgba(${r},${g},${b},${p.e*.12})`;cx.beginPath();cx.arc(p.x,p.y,s*5,0,6.283);cx.fill()}
    }
    cx.globalCompositeOperation='source-over';
    rings=rings.filter(q=>q.r<400);
    for(const q of rings){q.r+=dt*850;cx.strokeStyle=`rgba(25,216,232,${1-q.r/400})`;cx.lineWidth=1.5;cx.beginPath();cx.arc(q.x,q.y,q.r,0,6.283);cx.stroke()}
    if(mouse.on){cx.strokeStyle='rgba(25,216,232,.3)';cx.setLineDash([3,5]);cx.beginPath();cx.arc(mouse.x,mouse.y,120,0,6.283);cx.stroke();cx.setLineDash([])}
    hist.push(I);hist.shift();
    const w=tr.clientWidth,h=tr.clientHeight,max=Math.max(30,...hist);
    tx.clearRect(0,0,w,h);tx.strokeStyle='rgba(233,239,242,.07)';tx.lineWidth=1;
    for(let i=1;i<4;i++){tx.beginPath();tx.moveTo(0,h*i/4);tx.lineTo(w,h*i/4);tx.stroke()}
    tx.strokeStyle='#FFB45E';tx.lineWidth=1.6;tx.beginPath();
    hist.forEach((v,i)=>{const x=i/(hist.length-1)*w,y=h-3-(v/max)*(h-8);i?tx.lineTo(x,y):tx.moveTo(x,y)});tx.stroke();
    countsEl.textContent=Math.round(I*100).toLocaleString('en');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* one orchestrated moment on load */
if(!reduce)setTimeout(()=>pulse(W*.68,H*.42),700);
